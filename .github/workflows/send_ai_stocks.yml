name: Send AI Stocks Valuation to Telegram

on:
  schedule:
    - cron: "22 13 26 5 *"
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Debug - Check Token Setup
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN_VAR }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Token length: ${#TELEGRAM_BOT_TOKEN}"
          echo "Chat ID length: ${#TELEGRAM_CHAT_ID}"
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is EMPTY! Please set vars.TELEGRAM_BOT_TOKEN_VAR in GitHub"
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is EMPTY!"
            exit 1
          fi
          echo "Token starts with: ${TELEGRAM_BOT_TOKEN:0:10}..."
          echo "All credentials present, proceeding..."

      - name: Send AI Stock Valuation Table
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN_VAR }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import os, requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          base_url = f"https://api.telegram.org/bot{token}"

          def send(msg):
              resp = requests.post(f"{base_url}/sendMessage", json={
                  "chat_id": chat_id,
                  "text": msg,
                  "parse_mode": "Markdown"
              }, timeout=15)
              if resp.status_code != 200:
                  print(f"Failed: {resp.text}")
              return resp.status_code == 200

          # ── 第一則：標題 ──────────────────────────────────────────────
          header = (
              "📊 *AI 類股估值與進場價格總覽*\n"
              "━━━━━━━━━━━━━━━━━━━━\n"
              "資料基準：2026年5月  |  台灣時間\n"
              "⚠️ 僅供參考，不構成投資建議\n"
          )
          send(header)

          # ── 第二則：電源散熱 ──────────────────────────────────────────
          msg2 = (
              "🔥 *一、電源 & 散熱*\n"
              "━━━━━━━━━━━━━━\n\n"
              "🏢 *奇鋐 (3017)*\n"
              "　現價約 470元 | 本益比 25-30x\n"
              "　2026E EPS ≈ 17元\n"
              "　📌 進場區：*390-420元*\n"
              "　🎯 目標：560元  ⛔ 止損：370元\n\n"
              "🏢 *雙鴻 (3324)*\n"
              "　現價約 270元 | 本益比 22-28x\n"
              "　2026E EPS ≈ 11元\n"
              "　📌 進場區：*220-240元*\n"
              "　🎯 目標：320元  ⛔ 止損：210元\n\n"
              "🏢 *健策 (3136)*\n"
              "　現價約 580元 | 本益比 28-35x\n"
              "　2026E EPS ≈ 19元\n"
              "　📌 進場區：*480-520元*\n"
              "　🎯 目標：680元  ⛔ 止損：460元\n\n"
              "🏢 *台達電 (2308)*\n"
              "　現價約 340元 | 本益比 20-25x\n"
              "　2026E EPS ≈ 15元\n"
              "　📌 進場區：*280-310元*\n"
              "　🎯 目標：400元  ⛔ 止損：265元\n\n"
              "🏢 *川湖 (2059)*\n"
              "　現價約 1,150元 | 本益比 30-38x\n"
              "　2026E EPS ≈ 35元\n"
              "　📌 進場區：*950-1,050元*\n"
              "　🎯 目標：1,350元  ⛔ 止損：900元\n\n"
              "🏢 *勤誠 (8210)*\n"
              "　現價約 380元 | 本益比 22-28x\n"
              "　2026E EPS ≈ 15元\n"
              "　📌 進場區：*300-330元*\n"
              "　🎯 目標：450元  ⛔ 止損：285元\n\n"
              "🏢 *富世達 (3803)*\n"
