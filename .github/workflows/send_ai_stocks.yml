          )
          send(msg4)

          # ── 第五則：AI Server ODM ─────────────────────────────────────
          msg5 = (
              "🖥️ *四、AI Server ODM*\n"
              "━━━━━━━━━━━━━━\n\n"
              "🏢 *緯穎 (6669)*\n"
              "　現價約 3,200元 | 本益比 22-28x\n"
              "　2026E EPS ≈ 128元\n"
              "　📌 進場區：*2,600-2,850元*\n"
              "　🎯 目標：3,800元  ⛔ 止損：2,450元\n\n"
              "🏢 *廣達 (2382)*\n"
              "　現價約 320元 | 本益比 18-24x\n"
              "　2026E EPS ≈ 15元\n"
              "　📌 進場區：*265-290元*\n"
              "　🎯 目標：380元  ⛔ 止損：250元\n\n"
              "🏢 *英業達 (2356)*  ← 你持有中\n"
              "　現價約 62.6元 | 本益比 20-24x\n"
              "　2026E EPS ≈ 2.92元\n"
              "　📌 進場區：*52-57元*\n"
              "　🎯 目標：70-75元  ⛔ 止損：62元以下\n"
              "　💼 你的成本：53.9元 | 獲利約 +16%\n"
              "　⚠️ 現價接近分析師目標上緣(63元)\n"
          )
          send(msg5)

          # ── 第六則：Edge AI ───────────────────────────────────────────
          msg6 = (
              "📱 *五、Edge AI & 端側推理*\n"
              "━━━━━━━━━━━━━━\n\n"
              "🏢 *聯發科 (2454)*  (同第二板塊)\n"
              "　Edge AI 晶片龍頭，手機+車用 AI\n\n"
              "🏢 *神達 (3706)*\n"
              "　現價約 68元 | 本益比 14-18x\n"
              "　2026E EPS ≈ 4.2元\n"
              "　📌 進場區：*55-62元*\n"
              "　🎯 目標：82元  ⛔ 止損：52元\n\n"
              "🏢 *研揚 (6121)*\n"
              "　現價約 180元 | 本益比 16-22x\n"
              "　2026E EPS ≈ 9元\n"
              "　📌 進場區：*145-162元*\n"
              "　🎯 目標：210元  ⛔ 止損：138元\n\n"
              "🏢 *凌華 (6166)*\n"
              "　現價約 220元 | 本益比 18-24x\n"
              "　2026E EPS ≈ 10元\n"
              "　📌 進場區：*175-198元*\n"
              "　🎯 目標：260元  ⛔ 止損：165元\n"
          )
          send(msg6)

          # ── 第七則：總結 ──────────────────────────────────────────────
          msg7 = (
              "📋 *操作策略總結*\n"
              "━━━━━━━━━━━━━━\n\n"
              "🟢 *現在可佈局*（拉回至進場區）\n"
              "  川湖、世芯-KY、台積電、緯穎\n"
              "  台光電、聯亞\n\n"
              "🟡 *持有觀望*（已創高，等回調）\n"
              "  奇鋐、健策、廣達、華星光\n\n"
              "🔴 *謹慎追高*（超漲，等拉回）\n"
              "  英業達（你持有中，接近上緣）\n"
              "  創意、聯發科\n\n"
              "━━━━━━━━━━━━━━━━━━━━\n"
              "📌 *進場區 = 技術面支撐 + 估值合理區間*\n"
              "📌 *止損 = 重要支撐破底就出場*\n"
              "⚠️ 以上均為分析參考，非投資建議\n"
              "🤖 @Jim2_stock_bot 自動篩選系統"
          )
          send(msg7)

          print("All messages sent!")
          EOF
