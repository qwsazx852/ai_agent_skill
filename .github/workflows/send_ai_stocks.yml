          )
          send(msg2)

          # ── 第三則：ASIC/IC設計 ────────────────────────────────────────
          msg3 = (
              "🧠 *二、ASIC & IC 設計*\n"
              "━━━━━━━━━━━━━━\n\n"
              "🏢 *台積電 (2330)*\n"
              "　現價約 1,050元 | 本益比 28-35x\n"
              "　2026E EPS ≈ 35元\n"
              "　📌 進場區：*900-960元*\n"
              "　🎯 目標：1,300元  ⛔ 止損：850元\n\n"
              "🏢 *聯發科 (2454)*\n"
              "　現價約 1,200元 | 本益比 22-28x\n"
              "　2026E EPS ≈ 50元\n"
