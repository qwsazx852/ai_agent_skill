name: 📱 測試 Telegram 通知 (v3)

on:
  push:
    branches:
      - claude/stock-screening-tool-Gggkw
    paths:
      - '.github/workflows/test_telegram.yml'

jobs:
  test-telegram:
    name: 傳送測試訊息
    runs-on: ubuntu-latest

    steps:
      - name: 📱 傳送 Telegram 測試訊息
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import os, sys, requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not token or not chat_id:
              print("❌ TELEGRAM_BOT_TOKEN 或 TELEGRAM_CHAT_ID 未設定")
              sys.exit(1)

          print(f"Bot Token 前10碼: {token[:10]}...")
          print(f"Chat ID: {chat_id}")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "parse_mode": "Markdown",
              "text": (
                  "✅ *台灣股市篩選系統* 設定成功！\n\n"
                  "嗨 晉嘉，GitHub Actions 連線正常 🎉\n\n"
                  "📊 每天台灣時間 *14:30* 自動推送今日精選股票。\n\n"
                  "🇹🇼 準備好開始追蹤台股了！"
              ),
          }

          resp = requests.post(url, json=payload, timeout=10)
          print(f"HTTP Status: {resp.status_code}")
          print(f"API 回應: {resp.text}")

          if resp.status_code == 200 and resp.json().get("ok"):
              print("✅ Telegram 訊息傳送成功！")
          else:
              print("❌ 傳送失敗")
              sys.exit(1)
          EOF
