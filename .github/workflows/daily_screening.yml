name: Taiwan Stock Daily Screening

on:
  schedule:
    - cron: "45 7 * * 1-5"

  push:
    branches:
      - claude/stock-screening-tool-Gggkw

  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen-stocks:
    name: Daily Stock Screening
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: claude/stock-screening-tool-Gggkw
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Results Directory
        run: mkdir -p results

      - name: Run Stock Screening
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Running stock screening with real data..."
          python run_screener.py --top 10 --notify

      - name: Commit Screening Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Stock Screener Bot"

          if git diff --quiet results/; then
            echo "No changes to commit"
          else
            git add results/
            DATE=$(date +"%Y-%m-%d %H:%M UTC")
            git commit -m "Daily screening results - $DATE"

            for i in 1 2 3; do
              if git push origin claude/stock-screening-tool-Gggkw; then
                echo "Results committed"
                break
              else
                echo "Push conflict, retrying ($i/3)..."
                git pull --rebase origin claude/stock-screening-tool-Gggkw
              fi
            done
          fi

      - name: Upload Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screening-results-${{ github.run_number }}
          path: |
            results/latest_screening.json
            results/screening_history.json
            results/*.log
          retention-days: 30

      - name: Send Failure Alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat  = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          url   = os.environ.get("RUN_URL", "")
          if token and chat:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat,
                        "text": f"Stock screening failed. Check: {url}"},
                  timeout=10,
              )
          EOF
